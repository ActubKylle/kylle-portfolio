<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Primary meta -->
    <title>Kylle Nichole Actub — Full-Stack Web Developer</title>
    <meta
      name="description"
      content="Kylle Nichole Actub is a full-stack web developer (React, Next.js, Laravel, PHP, MySQL) based in Cebu, PH. Open to remote roles."
    />
    <meta name="author" content="Kylle Nichole Actub" />
    <meta name="theme-color" content="#0d1117" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kylle Nichole Actub — Full-Stack Web Developer" />
    <meta
      property="og:description"
      content="Full-stack web developer — React, Next.js, Laravel, PHP, MySQL. Based in Cebu, PH. Open to remote roles."
    />
    <!-- TODO: add a real 1200x630 share image at public/og-image.png -->
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kylle Nichole Actub — Full-Stack Web Developer" />
    <meta
      name="twitter:description"
      content="Full-stack web developer — React, Next.js, Laravel, PHP, MySQL. Based in Cebu, PH."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Fonts: preconnect + non-blocking load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- No-flash theme: set the <html> class before first paint. Mirrors the
         logic in src/hooks/useDarkMode.js (stored > OS-light > dark default). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored
            ? stored === 'dark'
            : !window.matchMedia('(prefers-color-scheme: light)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>This portfolio needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
  </body>
</html>
